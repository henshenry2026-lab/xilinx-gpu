name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Verilog tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Test, simulate, synthesize and verify preview
        run: python tools/check.py
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            build/*.log
            build/*.png
            build/check-summary.json
            build/npu-memory-summary.json
            build/npu-cycle-summary.json
            build/npu-stream-*-cycles.txt
          retention-days: 14
